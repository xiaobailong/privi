name: privi
description: 密册 — personal on-device Android media vault.
publish_to: "none"
version: 1.0.63

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (manual Riverpod 3.x providers)
  flutter_riverpod: ^3.0.0

  # Local database (metadata)
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24

  # Storage & paths
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  package_info_plus: ^9.0.1
  http: ^1.6.0
  pub_semver: ^2.2.0
  restart_app: ^1.8.3
  uuid: ^4.5.0

  # Import: file picker + share intent
  file_picker: ^10.0.0
  receive_sharing_intent: 1.9.0
  # System gallery albums for Visible tab
  photo_manager: ^3.6.0
  permission_handler: ^11.3.1

  # Playback: native ExoPlayer via MethodChannel + ActivityResult VLC hand-off
  android_intent_plus: ^5.2.0

  # Security: PIN hash + biometric
  local_auth: ^2.3.0
  local_auth_android: any
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5
  cryptography: ^2.9.0

  # Formatting
  intl: ^0.20.2

  # Share selected gallery items (Visible — More)
  share_plus: ^10.0.0

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  # DO NOT bump to >= 10.2.0 while drift_dev is < 2.32.1: analyzer 10.2.0 turned
  # the first argument of `references(Albums, #id, ...)` into a `TypeLiteral`
  # node, which drift_dev 2.31.0 rejects ("This parameter should be a simple
  # class name") and silently drops the foreign key. Fixed upstream in
  # drift_dev 2.32.1 ("Fix parsing references() with analyzer 10.2.0 and later");
  # see memory-bank/ISSUE-020.
  analyzer: 10.1.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/branding/app_icon_192.png