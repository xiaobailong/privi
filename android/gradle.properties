# ---- JVM 内存配置（改小过一次，别再调回去） ----
# 本机 16 核 / 27G 物理内存，构建时同时有 Gradle 守护进程 + Kotlin 编译守护进程
# （android/.kotlin/sessions/*.salive 就是它）+ 可能的 IDE JVM。Release 走 R8 全模式压缩
# （app/build.gradle.kts 里 isMinifyEnabled=true），C2 编译 R8 内部类会产生大量原生内存
# （compiler arena / Metaspace / CodeCache）。旧配置 -Xmx8G -XX:MaxMetaspaceSize=4G 会把
# "物理内存 + 页面文件"的提交上限榨干，JVM 连 Chunk::new 申请 1.5MB 都失败，Gradle 守护进程
# 直接被干掉，日志只留下：
#   "The message received from the daemon indicates that the daemon has disappeared."
#   "JVM crash log found: ... android/hs_err_pid58400.log"
# 崩溃日志中的证据：arena.cpp:168 OOM + "TotalPageFile size 54340M (AvailPageFile size 23M)"。
# 结论：这不是堆溢出，而是系统提交内存耗尽 —— 4G 堆对 R8 压缩足够，剩下的留给 JVM 原生部分。
# HeapDumpPath 指向 build/，避免堆转储和崩溃日志散落在 android/ 目录。
# 2026-09-22 复发（hs_err_pid51552.log）：R8 阶段 JVM 想把堆扩到 -Xmx4G 上限时
#   "Native memory allocation (mmap) failed to map 765460480 bytes for G1 virtual space"
#   （os_windows.cpp:3604 / Out of Memory Error，elapsed 303s）。
# 本机同时在跑 IDE + Gradle + Kotlin 守护进程时，4G 堆的"预留 + 增长"会顶到提交上限，
# 因此把 Gradle 堆收到 3G、Kotlin 守护进程收到 1G，给原生内存留出余量（见 ISSUE-004）。
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=384m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=../build/gradle_heapdump.hprof
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# gen_snapshot OOM 缓解：给 gen_snapshot 传 --no-strip（跳过 strip 阶段，降 AOT 峰值内存）。
# Flutter 3.47 起 `flutter {}` DSL 里的 extraGenSnapshotOptions 已移除，改读这个 project property
# （FlutterPlugin.kt: project.findProperty("extra-gen-snapshot-options")）。
# 多个选项用空格分隔；见 ADR-009 / ISSUE-004。
extra-gen-snapshot-options=--no-strip
kotlin.jvm.target.validation.mode=warning
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
systemProp.gradle.user.home=D\:/WorkSpace/test/privi/.gradle_home
kotlin.incremental=false
# Kotlin 编译守护进程是独立 JVM：默认堆上限跟随物理内存（可达 4G+）且常驻数小时，
# 崩溃那次它正与 Gradle 守护进程抢内存。显式限死，别让它无上限膨胀。
# 2026-09-22：从 2G 收到 1G（本项目 Kotlin 源码量很小，1G 足够），把提交内存留给 R8。
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m
