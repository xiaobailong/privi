# ---- JVM 内存配置（改小过一次，别再调回去） ----
# 本机 16 核 / 27G 物理内存，构建时同时有 Gradle 守护进程 + Kotlin 编译守护进程
# （android/.kotlin/sessions/*.salive 就是它）+ 可能的 IDE JVM。Release 走 R8 全模式压缩
# （app/build.gradle.kts 里 isMinifyEnabled=true），C2 编译 R8 内部类会产生大量原生内存
# （compiler arena / Metaspace / CodeCache）。旧配置 -Xmx8G -XX:MaxMetaspaceSize=4G 会把
# "物理内存 + 页面文件"的提交上限榨干，JVM 连 Chunk::new 申请 1.5MB 都失败，Gradle 守护进程
# 直接被干掉，日志只留下：
#   "The message received from the daemon indicates that the daemon has disappeared."
#   "JVM crash log found: ... android/hs_err_pid58400.log"
# 崩溃日志中的证据：arena.cpp:168 OOM + "TotalPageFile size 54340M (AvailPageFile size 23M)"。
# 结论：这不是堆溢出，而是系统提交内存耗尽 —— 4G 堆对 R8 压缩足够，剩下的留给 JVM 原生部分。
# HeapDumpPath 指向 build/，避免堆转储和崩溃日志散落在 android/ 目录。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=384m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=../build/gradle_heapdump.hprof
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
kotlin.jvm.target.validation.mode=warning
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
systemProp.gradle.user.home=D\:/WorkSpace/test/privi/.gradle_home
kotlin.incremental=false
# Kotlin 编译守护进程是独立 JVM：默认堆上限跟随物理内存（可达 4G+）且常驻数小时，
# 崩溃那次它正与 Gradle 守护进程抢内存。显式限死，别让它无上限膨胀。
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m
